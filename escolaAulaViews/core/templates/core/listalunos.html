{% extends 'base.html' %}
{% load static %}

{% block links %}
    <link rel="stylesheet" href="{% static 'css/listalunos.css' %}">
{% endblock links %}

{% block content %}

<h2>Alunos matriculados</h2>
<div class="list">
    {% for aluno in alunos %}
        <div class="card" style="border: 2px solid #000; padding: 10px;">
            <p><b>{{ aluno.aluno }}</b></p>
            <p class="nota">Nota:{{ aluno.nota }}</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
