{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greek Burger</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block css %}
    {% endblock %}
</head>
<body>

<header>
    <div class="logo">
        Greek Burger
    </div>

    <nav>
        <a href="#">Início</a>
        <a href="{% url 'cardapio' %}#cardapio">Cardápio</a>
        <a href="#">Promoções</a>
        <a href="#">Contato</a>
    </nav>

    <div class="status">
        {% block status %}
        {% endblock status %}
    </div>
</header>

<main>
    {% block content %}

    {% endblock %}
</main>

<footer>

    <div class="footer-logo">
        Greek Burger
    </div>

    <div class="footer-links">
        <a href="#">Termos de Serviço</a>
        <a href="#">Política de Privacidade</a>
    </div>

    <p>
        © 2026 Greek Burger - Todos os direitos reservados.
    </p>

</footer>

</body>
</html>
