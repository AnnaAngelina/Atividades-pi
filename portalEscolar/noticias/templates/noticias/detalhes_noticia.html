{% extends 'base.html' %}

{% block title %}Detalhes | Portal de Notícias{% endblock %}

{% block content %}

<section class="hero-section">

    <aside class="latest-newsno-home">

        <div class="categorias-lista">
            <small>{{ noticia.categoria.nome }}</small>
        </div>

        <div class="section-heading">
            <h2>{{ noticia.manchete }}</h2>
        </div>

        <hr>

        <p class="descricao-noticia">
            {{ noticia.descricao }}
        </p>   

        {% for tag in noticia.tags.all %}
            <div>
                <small style="color: grey;">#{{ tag.titulo }}</small>
            </div>
        {% endfor %}

    </aside>

</section>

{% endblock %}
