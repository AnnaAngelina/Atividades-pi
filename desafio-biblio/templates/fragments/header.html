{% load static %}

{% block links %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/header.css' %}">

{% endblock links %}


{% block main %}

    <header class="site-header">
        <div class="header-inner">

            <a class="brand" href="{% url 'home' %}" aria-label="Página inicial">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 4.5C4 3.7 4.7 3 5.5 3H11c1 0 1.8.6 2 1.5C13.2 3.6 14 3 15 3h3.5c.8 0 1.5.7 1.5 1.5v13c0 .8-.7 1.5-1.5 1.5H15c-1 0-1.8.6-2 1.4-.2-.8-1-1.4-2-1.4H5.5C4.7 19 4 18.3 4 17.5v-13Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M12 4.7v14" stroke="currentColor" stroke-width="1.4"/>
                </svg>
            </span>
            Books
            </a>

            <nav class="nav-pills" aria-label="Navegação principal">
            <a class="pill is-active" href="{% url 'listar_livros' %}">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.2C4 4.5 4.6 4 5.3 4h5.6c.6 0 1.1.5 1.1 1v14.5c0 .5-.6.8-1 .5-1.2-.9-2.8-1.5-4.7-1.5H5.3c-.7 0-1.3-.5-1.3-1.2V5.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M20 5.2c0-.7-.6-1.2-1.3-1.2h-5.6c-.6 0-1.1.5-1.1 1v14.5c0 .5.6.8 1 .5 1.2-.9 2.8-1.5 4.7-1.5h1c.7 0 1.3-.5 1.3-1.2V5.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                Livros
            </a>
            </nav>

            <nav class="nav-pills" aria-label="Navegação principal">
            <a class="pill is-active" href="{% url 'listar_autores' %}">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.2C4 4.5 4.6 4 5.3 4h5.6c.6 0 1.1.5 1.1 1v14.5c0 .5-.6.8-1 .5-1.2-.9-2.8-1.5-4.7-1.5H5.3c-.7 0-1.3-.5-1.3-1.2V5.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M20 5.2c0-.7-.6-1.2-1.3-1.2h-5.6c-.6 0-1.1.5-1.1 1v14.5c0 .5.6.8 1 .5 1.2-.9 2.8-1.5 4.7-1.5h1c.7 0 1.3-.5 1.3-1.2V5.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                Autores
            </a>
            </nav>

            <div class="header-actions">
            <button class="icon-btn" type="button" aria-label="Itens salvos">
                <svg viewBox="0 0 24 24" fill="none"><path d="M6 4.5c0-.8.7-1.5 1.5-1.5h9c.8 0 1.5.7 1.5 1.5v15.3c0 .6-.7 1-1.2.6L12 16.8l-4.8 3.6c-.5.4-1.2 0-1.2-.6V4.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </button>
            <button class="icon-btn" type="button" aria-label="Minha estante">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 4v16M9 4v16M14 4.6l4.4 15.4M4 4h5M4 20h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="avatar-btn" type="button" aria-label="Minha conta">
                <span class="avatar-fallback">LR</span>
            </button>
            <button class="icon-btn icon-btn--menu" type="button" aria-label="Abrir menu">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            </div>

        </div>
    </header>

{% endblock main %}
